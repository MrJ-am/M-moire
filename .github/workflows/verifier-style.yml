name: Vérifier le portage ElmUI sans publier
on:
  push:
    branches: [migration/style-mrjam]
    paths:
      - .github/workflows/verifier-style.yml
      - docs/src/**
      - docs/scripts/**
      - docs/tests/**
      - docs/site/**
      - docs/identite/**
      - docs/elm.json
      - docs/style-mrjam.json
      - docs/package*.json
      - docs/playwright.config.cjs
      - docs/PORTAGE-ELMUI.md
permissions:
  contents: read
concurrency:
  group: portage-mrjam-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matheval_api_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ELM_HOME: /tmp/memoire-elm-cache
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/matheval_api_test
      BROWSER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/matheval_browser_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les outils verrouillés et les bases jetables
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils postgresql-client
          npm --prefix docs ci
          npm --prefix server ci
          createdb -h 127.0.0.1 -U postgres matheval_browser_test
      - name: Vérifier les données, les contrats et les sources Elm
        run: |
          set -euo pipefail
          npm --prefix docs run build:main
          npm --prefix docs run check:data
          npm --prefix docs run test:data
          python3 -m unittest discover -s docs/tests -p 'test_published_site.py'
          node docs/scripts/test-survey.cjs
          npm --prefix docs run test:construction
          npm --prefix docs run test:logic
          npm --prefix server test
          docs/node_modules/.bin/elm-format docs/src/Main.elm docs/src/Survey.elm docs/src/Administration.elm docs/src/DemoCard.elm --validate
      - name: Compiler les trois points d’entrée avec le style figé
        run: |
          npm --prefix docs run build:main
          node -e "const v=require('./docs/style-mrjam.json'); if(!/^[a-f0-9]{40}$/.test(v.revision)) throw Error('Révision inattendue');"
          git diff --exit-code -- research docs/data docs/site/data
      - name: Tester les interfaces HTTP et la collecte réelle
        run: |
          npm --prefix docs run test:e2e:install:ci
          PLAYWRIGHT_JUNIT_OUTPUT_FILE=test-results/resultats.xml npm --prefix docs run test:e2e -- --reporter=list,junit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controles-portage-mrjam
          path: docs/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Conserver les JavaScript vérifiés, sans publication
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artefacts/admin"
          cp docs/site/main.js docs/site/survey.js "$RUNNER_TEMP/artefacts/"
          cp docs/site/admin/administration.js "$RUNNER_TEMP/artefacts/admin/"
          cp docs/style-mrjam.json "$RUNNER_TEMP/artefacts/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/artefacts/commit-verifie.txt"
          (cd "$RUNNER_TEMP/artefacts" && sha256sum main.js survey.js admin/administration.js style-mrjam.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-portage-mrjam
          path: ${{ runner.temp }}/artefacts
          retention-days: 7
