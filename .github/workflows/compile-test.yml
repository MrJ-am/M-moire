name: Vérifier et publier Matheval
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matheval-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matheval_api_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/matheval_api_test
      BROWSER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/matheval_browser_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            server/package-lock.json
      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils postgresql-client nix-bin
          npm --prefix docs ci
          npm --prefix server ci
          createdb -h 127.0.0.1 -U postgres matheval_browser_test
      - name: Vérifier les données et la collecte
        run: |
          for module in deploy/matheval.nix deploy/legacy-nginx.nix deploy/hostinger/*.nix; do
            sudo nix-instantiate --store local --parse "$module" >/dev/null
          done
          npm --prefix docs run check:data
          npm --prefix docs run test:data
          python3 -m unittest discover -s docs/tests -p 'test_published_site.py'
          node docs/scripts/test-survey.cjs
          npm --prefix docs run test:logic
          npm --prefix server test
      - name: Construire le site
        run: npm --prefix docs run build:main
      - name: Vérifier dans les navigateurs
        run: |
          npm --prefix docs run test:e2e:install:ci
          npm --prefix docs run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: docs/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Préparer la version vérifiée
        run: |
          python3 docs/scripts/check-published-site.py manifest docs/site > release-manifest.json
          printf '%s\n' "${GITHUB_SHA}" > RELEASE
          tar --exclude=node_modules --exclude=tests -czf matheval.tar.gz docs/site server research/bank.json research/codebook.json RELEASE release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: matheval-release
          path: matheval.tar.gz
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.MATHEVAL_HOST != ''
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: matheval-production
      url: https://principiipetit.io/matheval/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: matheval-release
      - name: Configurer l’accès de déploiement
        env:
          SSH_KEY: ${{ secrets.MATHEVAL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MATHEVAL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Installer la version vérifiée
        env:
          MATHEVAL_HOST: ${{ vars.MATHEVAL_HOST }}
        run: |
          scp matheval.tar.gz "matheval-deploy@${MATHEVAL_HOST}:/srv/matheval/incoming/${GITHUB_SHA}.tar.gz"
          ssh "matheval-deploy@${MATHEVAL_HOST}" "matheval-release ${GITHUB_SHA}"
      - name: Vérifier les fichiers servis
        env:
          SITE_URL: https://principiipetit.io/matheval/
        run: |
          tar -xzf matheval.tar.gz release-manifest.json
          export EXPECTED_SITE="$(cat release-manifest.json)"
          python3 docs/scripts/check-published-site.py verify
