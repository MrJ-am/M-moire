name: Préparer la migration du style
on:
  push:
    branches: [migration/style-mrjam]
    paths: [.github/workflows/atelier-style.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELM_HOME: /tmp/memoire-elm-cache
      STYLE_REVISION: 52ad33f881b50feef91d60915d17bae90abfc592
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer l’outil de contrôle du corpus
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Vérifier les sources avant toute transformation
        run: |
          set -euo pipefail
          npm --prefix docs ci
          npm --prefix server ci
          npm --prefix docs run check:data
          npm --prefix docs run test:data
          npm --prefix docs run test:logic
          npm --prefix docs run build:main
      - name: Préparer la bibliothèque à la révision exacte
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/style-mrjam"
          git -C "$RUNNER_TEMP/style-mrjam" remote add origin https://github.com/MrJ-am/style-mrjam.git
          git -C "$RUNNER_TEMP/style-mrjam" fetch --depth=1 origin "$STYLE_REVISION"
          git -C "$RUNNER_TEMP/style-mrjam" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/style-mrjam" rev-parse HEAD)" = "$STYLE_REVISION"
          npm --prefix "$RUNNER_TEMP/style-mrjam" ci
          (cd "$RUNNER_TEMP/style-mrjam" && npm run verifier)
      - name: Préparer les sources de travail sans identifiants
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atelier"
          git rev-parse HEAD > "$RUNNER_TEMP/atelier/commit.txt"
          git archive HEAD docs server research deploy AGENTS.md .github > "$RUNNER_TEMP/atelier/sources.tar"
          git -C "$RUNNER_TEMP/style-mrjam" archive HEAD > "$RUNNER_TEMP/atelier/style-mrjam.tar"
          tar -czf "$RUNNER_TEMP/atelier/node_modules.tar.gz" docs/node_modules server/node_modules
          tar -czf "$RUNNER_TEMP/atelier/elm-home.tar.gz" -C "$ELM_HOME" .
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-style-reference
          path: ${{ runner.temp }}/atelier
          retention-days: 3
          if-no-files-found: error
